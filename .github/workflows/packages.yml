name: Packages

# Builds the macOS DMG, the Ubuntu 26.04 packages for amd64 and arm64, and a
# portable Windows zip. Runs on a version tag (v*), a push to a ci-* branch,
# or by hand; the packages are the run's artifacts.
on:
  push:
    tags: ['v*']
    # Packaging work is tried on a ci-* branch before a release is tagged.
    branches: ['ci-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the fldigi and Qt 6 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake autopoint libtool pkg-config \
            cmake ninja-build python3 gettext dpkg-dev file \
            libfltk1.4-dev \
            libpng-dev libsamplerate0-dev libsndfile1-dev \
            libgpiod-dev libx11-dev \
            qt6-base-dev
          sudo apt-get install -y fluid || true

      - name: Build the package
        run: ./scripts/make-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tcidigi-deb-${{ runner.arch }}
          path: dist/*.deb
          if-no-files-found: error

  dmg:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Homebrew bottles on a macOS 26 runner are built for macOS 26, the
      # DMG's minimum.
      - name: Install the build dependencies
        run: |
          brew install autoconf automake libtool pkg-config gettext \
            fltk libsamplerate libsndfile libpng jpeg-turbo qt

      - name: Build the DMG
        run: ./scripts/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tcidigi-dmg
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # The manuals hold a folder named aux, a reserved name on Windows. Git
      # refuses it in the index unless protectNTFS is off; the sparse
      # checkout then leaves the manuals, which the build does not use, out.
      - name: Allow the manuals' paths in the index
        shell: pwsh
        run: git config --global core.protectNTFS false
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/flarq_doxygen/
            !/fldigi_doxygen/
          sparse-checkout-cone-mode: false

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            autoconf automake libtool make pkgconf gettext-devel zip
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-fltk
            mingw-w64-ucrt-x86_64-libsamplerate
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-gettext
            mingw-w64-ucrt-x86_64-ntldd

      - name: Build the Windows zip
        run: ./scripts/make-windows.sh

      # Start the packaged program once from a throwaway configuration
      # whose TCI points at an unused local port: every DLL must load from
      # the zip's folder (not MSYS2's), and the engine must start and quit
      # cleanly. An error box would wait forever, so a run that has not
      # quit after two minutes lists the open windows and missing DLLs.
      - name: Start TCIdigi once
        run: |
          mkdir -p smoke
          printf '[station]\nname=CI\n' > smoke/tcidigi.ini
          printf '<FLDIGI_DEFS>\n<CONFIRMEXIT>0</CONFIRMEXIT>\n<TCI_ENABLE>1</TCI_ENABLE>\n<TCI_HOST>127.0.0.1</TCI_HOST>\n<TCI_PORT>50999</TCI_PORT>\n</FLDIGI_DEFS>\n' > smoke/fldigi_def.xml
          exe=$(ls dist/TCIdigi-*/TCIdigi.exe)
          PATH=/usr/bin:/c/Windows/system32:/c/Windows \
            "$exe" --config-dir "$(cygpath -m "$PWD/smoke")" --exit-after 15 \
            > smoke/run.txt 2>&1 &
          pid=$!
          for i in $(seq 120); do
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          if kill -0 $pid 2>/dev/null; then
            echo "TCIdigi is still running after 120 s. Open windows:"
            powershell -NoProfile -Command 'Get-Process | Where-Object { $_.MainWindowTitle } | Format-Table Id,ProcessName,MainWindowTitle -AutoSize | Out-String -Width 300'
            echo "DLLs not found:"
            PATH=/usr/bin:/c/Windows/system32 /ucrt64/bin/ntldd -R "$exe" | grep -i "not found" || echo "(none)"
            kill $pid
            cat smoke/run.txt
            exit 1
          fi
          wait $pid || true
          cat smoke/run.txt
          if grep -q "Aborting" smoke/run.txt; then
            tail -n 40 smoke/status_log.txt 2>/dev/null || true
            exit 1
          fi
          echo "TCIdigi started and quit"
      - name: Keep the smoke-test folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke
          path: smoke

      - uses: actions/upload-artifact@v4
        with:
          name: tcidigi-windows
          path: dist/*.zip
          if-no-files-found: error
