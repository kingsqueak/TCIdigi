name: Packages

# Builds the macOS DMG, the Ubuntu 26.04 packages for amd64 and arm64, and a
# portable Windows zip. Runs on a version tag (v*), a push to a ci-* branch,
# or by hand; the packages are the run's artifacts.
on:
  push:
    tags: ['v*']
    # Packaging work is tried on a ci-* branch before a release is tagged.
    branches: ['ci-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the fldigi and Qt 6 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake autopoint libtool pkg-config \
            cmake ninja-build python3 gettext dpkg-dev file \
            libfltk1.4-dev \
            libpng-dev libsamplerate0-dev libsndfile1-dev \
            libgpiod-dev libx11-dev \
            qt6-base-dev
          sudo apt-get install -y fluid || true

      - name: Build the package
        run: ./scripts/make-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tcidigi-deb-${{ runner.arch }}
          path: dist/*.deb
          if-no-files-found: error

  dmg:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Homebrew bottles on a macOS 26 runner are built for macOS 26, the
      # DMG's minimum.
      - name: Install the build dependencies
        run: |
          brew install autoconf automake libtool pkg-config gettext \
            fltk libsamplerate libsndfile libpng jpeg-turbo qt

      - name: Build the DMG
        run: ./scripts/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tcidigi-dmg
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # The manuals hold a folder named aux, a reserved name on Windows. Git
      # refuses it in the index unless protectNTFS is off; the sparse
      # checkout then leaves the manuals, which the build does not use, out.
      - name: Allow the manuals' paths in the index
        shell: pwsh
        run: git config --global core.protectNTFS false
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/flarq_doxygen/
            !/fldigi_doxygen/
          sparse-checkout-cone-mode: false

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            autoconf automake libtool make pkgconf gettext-devel zip
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-fltk
            mingw-w64-ucrt-x86_64-libsamplerate
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-gettext
            mingw-w64-ucrt-x86_64-ntldd

      - name: Build the Windows zip
        run: ./scripts/make-windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tcidigi-windows
          path: dist/*.zip
          if-no-files-found: error
